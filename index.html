<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiểm Tra Tiến Độ 50 Phút - Môn Vật Lý 12</title>
    <link rel="stylesheet" href="style.css" />
    <!-- MathJax for rendering Physics Formulas -->
    <script>
      MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
        },
        svg: { fontCache: "global" },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
  </head>
  <body>
    <!-- Màn hình Đăng nhập -->
    <div id="login-screen" class="container">
      <div class="card login-card">
        <h1>Kiểm Tra Tiến Độ 50 Phút</h1>
        <h2>Môn Vật Lý 12 - Mã đề A05-2k9</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="student-name">Họ và tên học sinh</label>
            <input
              type="text"
              id="student-name"
              required
              placeholder="Nhập họ và tên..."
            />
          </div>
          <div class="form-group">
            <label for="student-class">Lớp</label>
            <input
              type="text"
              id="student-class"
              required
              placeholder="Ví dụ: 12A1"
            />
          </div>
          <div class="form-group">
            <label for="exam-time">Thời gian làm bài (phút)</label>
            <!-- Mặc định 50 phút -->
            <input type="number" id="exam-time" required value="50" min="1" />
          </div>
          <button type="submit" class="btn-primary">Bắt đầu làm bài</button>
          <p
            id="resume-notice"
            class="hidden"
            style="color: red; margin-top: 10px; font-weight: bold"
          >
            Đang có bài làm dang dở, hệ thống sẽ khôi phục!
          </p>
        </form>
      </div>
    </div>

    <!-- Màn hình Làm bài thi -->
    <div id="exam-screen" class="hidden">
      <div id="timer-bar" class="sticky-timerbar">
        <div class="student-info">
          Thí sinh: <span id="display-name"></span> | Lớp:
          <span id="display-class"></span>
        </div>
        <div class="timer-info">
          Thời gian còn lại: <span id="countdown" class="mono-font">00:00</span>
        </div>
      </div>

      <div class="exam-layout">
        <!-- Cột chứa câu hỏi -->
        <div class="main-content" id="questions-container">
          <!-- Render câu hỏi bằng JavaScript -->
        </div>

        <!-- Cột chứa bảng điều hướng -->
        <div class="sidebar">
          <div class="board-card">
            <h3>Bảng Câu Hỏi</h3>
            <div class="board-legend">
              <span class="legend-item"
                ><span class="box box-none"></span> Chưa làm</span
              >
              <span class="legend-item"
                ><span class="box box-done"></span> Đã làm</span
              >
              <span class="legend-item"
                ><span class="box box-flag"></span> Đánh dấu</span
              >
            </div>
            <div id="question-board" class="question-board">
              <!-- Render các ô số câu hỏi -->
            </div>
            <button
              id="submit-btn"
              class="btn-primary"
              style="width: 100%; margin-top: 20px"
            >
              Nộp bài
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Màn hình Kết quả -->
    <div id="result-screen" class="hidden container">
      <div class="card result-card">
        <h2>Kết Quả Bài Thi</h2>
        <div class="score-display mono-font">
          Điểm: <span id="final-score"></span>/10
        </div>
        <p>
          Số lần cảnh báo gian lận (rời tab): <span id="cheat-display">0</span>
        </p>
        <button id="review-btn" class="btn-primary">Xem lại chi tiết</button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
